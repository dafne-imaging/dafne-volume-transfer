[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam2-support-match"
version = "0.1.0"
description = "One shot support/query matching and SAM2 segmentation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Giuseppe Timpano"}
]
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "numpy>=2.0.1",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=10.4.0",
    "monai>=1.4",
    "medsam2 @ git+https://github.com/bowang-lab/MedSAM2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
napari = [
    "napari>=0.5",
    "qtpy",
]

[project.entry-points."napari.manifest"]
napari-sam2-support-match = "napari_sam2_support_match:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_sam2_support_match = ["napari.yaml"]