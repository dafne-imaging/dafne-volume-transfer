[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafne-sam2-tools"
version = "0.1.0"
description = "One shot support/query matching and SAM2 segmentation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Giuseppe Timpano"}
]
dependencies = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "numpy>=2.0.1",
    "scipy",
    "scikit-image",
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "pillow>=10.4.0",
    "monai>=1.4",
    "appdirs>=1.4.4",
    "sam2>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]
gui = [
    "qtpy",
]

[tool.setuptools.packages.find]
where = ["src"]
